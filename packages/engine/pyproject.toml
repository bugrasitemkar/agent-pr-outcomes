[project]
name = "review-router-engine"
version = "0.1.0"
description = "Pure, I/O-free risk tiering engine for Review Router"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_router_engine"]
